[package]
name = "plotweb-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
plotweb-common = { path = "../crates/plotweb-common" }

# rinch as GIT deps (pinned) so the trunk buildpack's sealed build VM — which
# can't see the sibling `../../rinch` path — fetches it from github in the fetch
# phase. Repin as rinch's main advances (kept in sync with the Dockerfile's
# RINCH_COMMIT). For local rinch co-dev, add an UNCOMMITTED [patch] (see DEPLOY.md).
# plotweb-common stays a path dep — it's in-repo and resolves via jkbase.toml's
# `context = "."` (the build VM mounts the whole repo).
rinch = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8", default-features = false, features = ["components", "theme"] }
rinch-core = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8", features = ["theme"] }
rinch-tabler-icons = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8" }
# Shared with the copy rinch-web already pulls; `serde` lights up DocNode
# (durable JSON save shape) + `Schema::node_from_doc` / `Node::to_doc`.
rinch-editor-core = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8", features = ["serde"] }
# Cross-platform HTTP client (web fetch / native ureq); replaces the web-only
# fetch in api.rs so the frontend compiles for desktop too.
rinch-http = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8" }


wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlSelectElement", "HtmlHeadElement", "DomTokenList",
    "Node", "NodeList", "Text", "Comment",
    "CssStyleDeclaration", "DomRect", "DomRectList",
    "Event", "MouseEvent", "PointerEvent", "KeyboardEvent", "InputEvent",
    "EventTarget",
    "Range", "Selection", "CharacterData",
    "console",
    "Headers", "Request", "RequestInit", "RequestMode", "RequestCredentials",
    "Response",
    "History", "PopStateEvent",
    "Navigator", "Clipboard",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType",
    "TouchEvent", "TouchList", "Touch",
    "File", "FileList", "FileReader", "Blob", "FormData", "Url", "HtmlAnchorElement",
    "ClipboardEvent", "DataTransfer", "DragEvent",
    "Storage", # localStorage for the Automerge persistence spike
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

console_error_panic_hook = "0.1"
console_log = "0.2"
log = "0.4"

[features]
# Expose rinch's debug server so `rinch-mcp-server` can drive the native window
# (screenshot / DOM query / computed styles / click / type). Opt-in and
# native-only — build with `cargo build --features debug-mcp`. Never enable it for
# a release or deploy build; it opens a local control port.
debug-mcp = ["rinch/debug"]

# ── Render backend ───────────────────────────────────────────────────────────
# Web: rinch-web (browser DOM). Desktop: rinch's native shell (winit/wgpu) via the
# `desktop` feature. The editor + mount come from whichever backend is active for
# the target — see `src/rinch_backend.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rinch-web = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8", features = ["collaboration"] }
# Browser randomness for the transitive automerge → uuid (Automerge actor ids).
# Without a randomness feature, uuid refuses to compile on wasm32; on native it
# uses the OS RNG by default (forcing the `js` feature there panics at startup).
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rinch = { git = "https://github.com/joeleaver/rinch", rev = "2c04aa64ce2fb1e7a24938fcb31449b92a72c7a8", features = ["desktop", "collaboration"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
