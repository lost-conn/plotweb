[package]
name = "plotweb-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
plotweb-common = { path = "../crates/plotweb-common" }

# rinch as GIT deps (pinned) so the trunk buildpack's sealed build VM — which
# can't see the sibling `../../rinch` path — fetches it from github in the fetch
# phase. Repin as rinch's main advances (kept in sync with the Dockerfile's
# RINCH_COMMIT). For local rinch co-dev, add an UNCOMMITTED [patch] (see DEPLOY.md).
# plotweb-common stays a path dep — it's in-repo and resolves via jkbase.toml's
# `context = "."` (the build VM mounts the whole repo).
rinch = { git = "https://github.com/joeleaver/rinch", rev = "1378a6d6b16f0e066d9a2e08d3d381b39863c5a7", default-features = false, features = ["components", "theme"] }
rinch-core = { git = "https://github.com/joeleaver/rinch", rev = "1378a6d6b16f0e066d9a2e08d3d381b39863c5a7", features = ["theme"] }
rinch-tabler-icons = { git = "https://github.com/joeleaver/rinch", rev = "1378a6d6b16f0e066d9a2e08d3d381b39863c5a7" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlSelectElement", "HtmlHeadElement", "DomTokenList",
    "Node", "NodeList", "Text", "Comment",
    "CssStyleDeclaration", "DomRect", "DomRectList",
    "Event", "MouseEvent", "PointerEvent", "KeyboardEvent", "InputEvent",
    "EventTarget",
    "Range", "Selection", "CharacterData",
    "console",
    "Headers", "Request", "RequestInit", "RequestMode", "RequestCredentials",
    "Response",
    "History", "PopStateEvent",
    "Navigator", "Clipboard",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType",
    "TouchEvent", "TouchList", "Touch",
    "File", "FileList", "FileReader", "Blob", "FormData", "Url", "HtmlAnchorElement",
    "ClipboardEvent", "DataTransfer", "DragEvent",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

console_error_panic_hook = "0.1"
console_log = "0.2"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
