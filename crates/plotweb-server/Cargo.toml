[package]
name = "plotweb-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
plotweb-common.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
axum.workspace = true
tokio.workspace = true
argon2.workspace = true
uuid.workspace = true
tower-http.workspace = true
tower-sessions.workspace = true
tower-sessions-sqlx-store.workspace = true
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest.workspace = true
plotweb-git.workspace = true
plotweb-import.workspace = true
plotweb-export.workspace = true
plotweb-crdt = { path = "../plotweb-crdt" }
# The canonical sync store speaks Automerge directly (no editor schema needed to run
# the sync protocol). Same 0.5 line as plotweb-crdt / rinch-editor-collab, so client
# and server bytes are one format.
automerge = "0.5"
# Cross-platform durable blob store — the CRDT backfill's write target (FsStore).
# Pinned to the SAME rinch rev as rinch-editor-collab (via plotweb-crdt).
rinch-storage = { git = "https://github.com/joeleaver/rinch", rev = "b6225418e09192bde4e2f04b572ac69cab1f9a2e", default-features = false }
rhypedb-engine.workspace = true
rhypedb-query.workspace = true
rhypedb-schema.workspace = true
anyhow.workspace = true
axum-extra = { version = "0.10", features = ["multipart"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# Integration tests act as sync *clients*, running the protocol against the app.
automerge = "0.5"
